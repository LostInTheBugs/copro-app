services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: copro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: copro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copro"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      COPRO_DATABASE_URL: postgresql+psycopg2://copro:${POSTGRES_PASSWORD}@db:5432/copro
      COPRO_SECRET_KEY: ${COPRO_SECRET_KEY}
      COPRO_UPLOAD_DIR: /data/uploads
      COPRO_FRONTEND_DIST: /app/frontend_dist
    volumes:
      - uploads:/data/uploads
      - ./frontend_dist:/app/frontend_dist:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
